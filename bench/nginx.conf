# Jalankan dari root repo: nginx -p "$PWD/" -c bench/nginx.conf
# Baseline HTTP plaintext, satu worker sebagaimana POC satu proses.
worker_processes 1;
pid /tmp/aginx-bench-nginx.pid;
error_log /tmp/aginx-bench-nginx-error.log warn;
events { worker_connections 16384; }
http {
    types { text/html html; text/css css; application/javascript js; }
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    server {
        listen 127.0.0.1:8081;
        root examples/www;
        index index.html;
        location ~ /\. { deny all; }
    }
}
